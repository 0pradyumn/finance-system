<!-- frontend/views/accounts.html - Accounts page  [Part 2: Accounts & Transactions] -->
<form method="post" action="/accounts" class="inline">
  <input name="name" placeholder="Account name" required maxlength="40">
  <select name="type">
    <option>Savings</option><option>Current</option><option>Cash</option><option>Credit Card</option><option>Wallet</option>
  </select>
  <input name="opening" type="number" step="0.01" placeholder="Opening balance">
  <button class="btn">Add account</button>
</form>

<table>
  <tr><th>Name</th><th>Type</th><th>Opening</th><th>Balance</th><th></th></tr>
  {{{rows}}}
</table>
