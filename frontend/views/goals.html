<!-- frontend/views/goals.html - Savings goals page  [Part 3: Dashboard, Budgets & Savings Goals] -->
<form method="post" action="/goals" class="inline">
  <input name="name" placeholder="Goal (e.g. Laptop)" aria-label="Goal name" required maxlength="40">
  <input name="target" type="number" step="0.01" min="0.01" placeholder="Target amount" aria-label="Target amount" required>
  <input name="saved" type="number" step="0.01" min="0" placeholder="Already saved" aria-label="Already saved">
  <input name="deadline" type="date" aria-label="Goal deadline">
  <button class="btn">Add goal</button>
</form>
{{{items}}}
