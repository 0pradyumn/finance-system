<!-- frontend/views/goals.html - Savings goals page  [Part 3: Dashboard, Budgets & Savings Goals] -->
<form method="post" action="/goals" class="inline">
  <input name="name" placeholder="Goal (e.g. Laptop)" required maxlength="40">
  <input name="target" type="number" step="0.01" min="1" placeholder="Target amount" required>
  <input name="saved" type="number" step="0.01" min="0" placeholder="Already saved">
  <input name="deadline" type="date">
  <button class="btn">Add goal</button>
</form>
{{{items}}}
